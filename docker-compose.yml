services:

  app:
    build: .
    container_name: jobmatch-app
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://jobmatch:jobmatch123@mongo:27017/jobmatch?authSource=admin&directConnection=true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      - mongo
      - kafka
      - redis
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: jobmatch-mongo
    environment:
      MONGODB_INITDB_ROOT_USERNAME: jobmatch
      MONGODB_INITDB_ROOT_PASSWORD: jobmatch123
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  kafka:
    image: apache/kafka:latest
    container_name: jobmatch-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  redis:
    image: redis:7-alpine
    container_name: jobmatch-redis
    ports:
      - "6379:6379"

volumes:
  mongodata: